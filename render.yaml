databases:
  - name: dishdash-db
    databaseName: dishdash
    user: dishdash
    plan: free

services:
  - type: web
    name: dishdash-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: dishdash-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FASTAPI_BASE_URL
        fromService:
          type: web
          name: dishdash-integration
          property: hostport

  - type: web
    name: dishdash-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -p $PORT -H 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: dishdash-backend
          property: hostport

  - type: web
    name: dishdash-integration
    runtime: python
    plan: free
    rootDir: integration-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
